name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two packages, not one: each installs and tests on its own, so a break
        # in one does not hide behind the other's green run.
        tool: [gradebook-tests, gradebook-code]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: ${{ matrix.tool }}
        run: |
          python -m pip install --upgrade pip
          # `pip install .[dev]` only warns when the extra does not exist, so it
          # can "succeed" having installed no test runner at all. Fall back, and
          # guarantee pytest either way.
          pip install -e ".[dev]" || pip install -e .
          python -m pip show pytest >/dev/null 2>&1 || pip install pytest

      - name: Pytest
        working-directory: ${{ matrix.tool }}
        run: pytest -q
