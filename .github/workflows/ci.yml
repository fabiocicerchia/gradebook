name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two packages, not one: each installs and tests on its own, so a break
        # in one does not hide behind the other's green run.
        tool: [gradebook-tests, gradebook-code]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: ${{ matrix.tool }}
        run: |
          # Each tool carries its own hash-pinned lockfile. Regenerate from
          # inside the tool directory after changing pyproject.toml:
          #   uv pip compile pyproject.toml --extra dev --generate-hashes \
          #     --universal -p 3.10 -o requirements-dev.txt
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Pytest
        working-directory: ${{ matrix.tool }}
        run: pytest -q

  # The extension is TypeScript in a Python repo: without a compile in CI, a
  # type error in it is invisible until someone opens the editor. Node is
  # pinned rather than taken from the runner image, so a change to that image
  # cannot quietly move what this is built and tested against — the same pin
  # the sibling repos use.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      # The server tests drive the real gradebook modules from this checkout.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
