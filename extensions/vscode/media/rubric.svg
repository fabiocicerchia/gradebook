<!-- Panel icon. Monochrome and drawn with currentColor: VS Code tints view
     container icons itself, and a coloured icon fights every theme it lands in.
     Same mark as media/icon.png — a marked page: the rubric, and the tick that
     says it has been scored. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
     stroke-linejoin="round" role="img" aria-label="gradebook">
  <title>gradebook</title>
  <rect x="4" y="2.75" width="16" height="18.5" rx="2.5"/>
  <path d="M8 7.5h8M8 11h5" opacity="0.55"/>
  <path d="M8 15.6l2.7 2.7L16.5 12.5"/>
</svg>
