# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gradebook
  description: >-
      Two tools that grade a repository against a weighted rubric and tell you which fix buys the most
      points.
  annotations:
    github.com/project-slug: fabiocicerchia/gradebook
    backstage.io/source-location: url:https://github.com/fabiocicerchia/gradebook/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/gradebook
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
