# FC-PY-001: the house rule set for the Python that sits outside the two tool
# packages — the VS Code extension's scan server. Each tool folder carries the
# same selection in its own pyproject.toml, since each is published on its own.
line-length = 120           # FC-GEN-045
# The floor both tools support, so nothing here is written in syntax the older
# of the two interpreters could not run.
target-version = "py310"

[lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

# An en dash is deliberate typography in this prose, not a mistyped hyphen.
allowed-confusables = ["–", "—", "·", "×"]

[lint.flake8-annotations]
mypy-init-return = true

[format]
quote-style = "double"
docstring-code-format = true
