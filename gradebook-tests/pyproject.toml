[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gradebook-tests"
version = "0.2.0" # x-release-please-version
description = "Score how effective a repository's test suite actually is"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gradebook-tests = "gradebook_tests:main"

[tool.setuptools]
py-modules = ["gradebook_tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
