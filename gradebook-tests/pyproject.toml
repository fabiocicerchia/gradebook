[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gradebook-tests"
version = "0.4.0" # x-release-please-version
description = "Score how effective a repository's test suite actually is"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gradebook-tests = "gradebook_tests:main"

[tool.setuptools]
packages = ["gradebook_tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# FC-PY-001: the house rule set, the same selection every other Python repo in
# the fleet carries.
line-length = 120           # FC-GEN-045
# The floor `requires-python` names, so UP cannot rewrite the tree into syntax
# the oldest supported interpreter would reject.
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

# An en dash is deliberate typography in this prose, not a mistyped hyphen.
allowed-confusables = ["–", "—", "·", "×"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# assert is the point; a magic number in a fixture is the fixture; a test that
# shells out to the CLI has to shell out.
"tests/**" = [
  "S101",     # assert is the point
  "ANN",      # a fixture's type is obvious from the fixture
  "PLR2004",  # a magic number in a fixture is the fixture
  "S603",     # a test for the CLI has to run the CLI
  "S607",
  "PLC0415",  # importing inside a test is how you patch before import
  "T201",     # a test that prints is reporting, not debugging
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[[tool.basedpyright.executionEnvironments]]
# gradebook_tests is one unit that happens to be spread over several files. A leading
# underscore here means "private to the package", which is the usual Python
# convention -- but the checker scopes it to the *file*, so every helper the
# package shares between its own modules reads as private-used-elsewhere and
# as unaccessed. Those reports are about the file boundary, not the code.
#
# Anything reaching in from outside the package is still caught: this scope is
# the package directory and nothing else.
root = "gradebook_tests"
reportPrivateUsage = false
reportUnusedFunction = false
reportUnusedClass = false
extraPaths = ["."]

# The man page rides along in the wheel: `pip install` puts it under
# <prefix>/share/man/man1, which is on the default manpath for a system install
# and for a --user one alike.
[tool.setuptools.data-files]
"share/man/man1" = ["man/gradebook-tests.1"]
